name: CI

on: [push, pull_request, workflow_dispatch]

permissions: {}

jobs:
  CI:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Linux x64 (Ubuntu 26.04) - GCC 15"
            os: ubuntu-26.04
            build: { cc: gcc-15, cxx: g++-15, linker: ld }
            rust: true
            extra_meson_args: -Ddocs=true

          - name: "Linux x64 (Ubuntu 26.04) - Clang 22 with ASan and UBSan"
            os: ubuntu-26.04
            build: { cc: clang-22, cxx: clang++-22, linker: ld.lld-22, sanitize: 'address,undefined' }
            extra_meson_args: -Dintrospection=disabled

          # We cannot reliably test this if GLib is built without TSan instrumentation.
          #- name: "Linux x64 (Ubuntu 26.04) - Clang 22 with TSan"
          #  os: ubuntu-26.04
          #  build: { cc: clang-22, cxx: clang++-22, linker: ld.lld-22, sanitize: 'thread' }
          #  extra_meson_args: -Dintrospection=disabled

          # Rust is not enabled here: the Rust test binaries link a static
          # sanitizer runtime, which clashes with -shared-libsan. The Rust
          # job below builds and runs fuzzers with Rust and ASan instead.

          - name: "macOS arm64 (26) - Xcode 26"
            os: macos-26
            build: { cc: clang, cxx: clang++, linker: ld.lld }
            rust: true
            extra_meson_args: -Dintrospection=disabled

    env:
      CC: ${{ matrix.build.cc }}
      CXX: ${{ matrix.build.cxx }}
      LD: ${{ matrix.build.linker }}
      CPPFLAGS: -Wall

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Ubuntu dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install \
            meson pkgconf \
            gi-docgen gobject-introspection \
            libarchive-dev libcfitsio-dev libcgif-dev \
            libexif-dev libexpat1-dev libffi-dev \
            libfftw3-dev libheif-dev libheif-plugin-aomenc \
            libhwy-dev libimagequant-dev libjpeg-dev \
            libjxl-dev liblcms2-dev libmatio-dev \
            libnifti-dev libopenexr-dev libopenjp2-7-dev \
            libopenslide-dev libpango1.0-dev libpng-dev \
            libpoppler-glib-dev librsvg2-dev libtiff5-dev \
            libwebp-dev

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          pip3 install meson --break-system-packages
          # Run `brew update` to ensure we have the latest formulae.
          # Note: GHA macOS runners set `HOMEBREW_NO_AUTO_UPDATE=1`
          # by default, as updating can be time-consuming.
          brew update
          brew install \
            ninja pkgconf \
            cfitsio cgif fftw fontconfig glib \
            highway jpeg-xl libarchive libexif \
            libheif libimagequant libmatio libpng \
            librsvg libtiff libultrahdr little-cms2 \
            mozjpeg openexr openjpeg openslide pango \
            poppler webp

      - name: Prepare macOS environment
        if: runner.os == 'macOS'
        run: |
          echo "PKG_CONFIG_PATH=$(brew --prefix mozjpeg)/lib/pkgconfig:$(brew --prefix libarchive)/lib/pkgconfig:$PKG_CONFIG_PATH" >> $GITHUB_ENV

      - name: Install Rust dependencies
        if: matrix.rust
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            # bindgen pulls in libclang
            sudo apt-get install rustc bindgen
          else
            # the runner image has rustc
            brew install bindgen
          fi
          rustc --version
          bindgen --version

      - name: Prepare sanitizers environment
        if: matrix.build.sanitize
        run: |
          # FIXME: remove `-DHWY_BROKEN_TARGETS=(HWY_AVX3|HWY_AVX3_DL)` once Highway is updated to 1.4.0
          # https://github.com/google/highway/issues/2705
          echo "CPPFLAGS=-g -fno-omit-frame-pointer -fno-sanitize=function -DFUZZING_BUILD_MODE_UNSAFE_FOR_PRODUCTION -DHWY_BROKEN_TARGETS=(HWY_AVX3|HWY_AVX3_DL)" >> $GITHUB_ENV
          echo "LDFLAGS=-g -shared-libsan" >> $GITHUB_ENV
          # Glib is built without -fno-omit-frame-pointer. We need
          # to disable the fast unwinder to get full stacktraces.
          echo "ASAN_OPTIONS=suppressions=${{ github.workspace }}/suppressions/asan.supp:fast_unwind_on_malloc=0:allocator_may_return_null=1" >> $GITHUB_ENV
          echo "LSAN_OPTIONS=suppressions=${{ github.workspace }}/suppressions/lsan.supp:fast_unwind_on_malloc=0" >> $GITHUB_ENV
          echo "TSAN_OPTIONS=suppressions=${{ github.workspace }}/suppressions/tsan.supp:halt_on_error=1:print_suppressions=1:ignore_noninstrumented_modules=1" >> $GITHUB_ENV
          # Ensure UBSan issues causes the program to abort.
          echo "UBSAN_OPTIONS=suppressions=${{ github.workspace }}/suppressions/ubsan.supp:halt_on_error=1:abort_on_error=1:print_stacktrace=1" >> $GITHUB_ENV
          echo "$(dirname $($CC -print-prog-name=llvm-symbolizer))" >> $GITHUB_PATH
          # https://wiki.ubuntu.com/PythonDebugPackages
          sudo apt-get install python3-dbg

      - name: Prepare ASan/UBSan
        if: matrix.build.sanitize == 'address,undefined'
        run: |
          ASAN_DSO=$($CC -print-file-name=libclang_rt.asan-x86_64.so)
          echo "SANITIZE_DSO=$ASAN_DSO" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=$(dirname $ASAN_DSO)" >> $GITHUB_ENV

      - name: Prepare TSan
        if: matrix.build.sanitize == 'thread'
        run: |
          TSAN_DSO=$($CC -print-file-name=libclang_rt.tsan-x86_64.so)
          echo "SANITIZE_DSO=$TSAN_DSO" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=$(dirname $TSAN_DSO)" >> $GITHUB_ENV

      - name: Configure libvips
        run:
          meson setup build
            -Ddebug=true
            -Dmagick=disabled
            -Drust=${{ matrix.rust && 'enabled' || 'disabled' }}
            ${{ matrix.extra_meson_args }}
            -Db_sanitize=${{ matrix.build.sanitize || 'none' }}
            -Db_lundef=${{ matrix.build.sanitize && 'false' || 'true' }}
          || (cat build/meson-logs/meson-log.txt && exit 1)

      - name: Build libvips
        run: meson compile -C build

      - name: Check libvips
        run:
          # TSan is slow, so disable timeout in test cases
          meson test -C build --timeout-multiplier=${{ matrix.build.sanitize == 'thread' && '0' || '1' }}
          || (cat build/meson-logs/testlog.txt && exit 1)

      - name: Install libvips
        run: sudo meson install -C build

      - name: Rebuild the shared library cache
        if: runner.os == 'Linux'
        run: sudo ldconfig

      - name: Install pyvips
        run: pip3 install pyvips[test] --break-system-packages

      - name: Run test suite
        env:
          VIPS_LEAK: 1
          LD_PRELOAD: ${{ env.SANITIZE_DSO }}
          PYTHON: ${{ matrix.build.sanitize && 'python3-dbg' || 'python3' }}
        run: $PYTHON -m pytest -sv --log-cli-level=WARNING test/test-suite

  # Rust support, see libvips/rust/README.md
  rust:
    name: "Rust: MSRV, clippy, rustfmt and fuzzing"
    runs-on: ubuntu-26.04
    env:
      MSRV: '1.77.0'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install \
            meson pkgconf bindgen clang libclang-rt-dev \
            libglib2.0-dev libexpat1-dev libpng-dev
          if ! command -v rustup; then
            curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi

      - name: Install Rust toolchains
        run: |
          rustup toolchain install "$MSRV" --profile minimal
          rustup toolchain install stable --profile minimal --component clippy,rustfmt

      - name: rustfmt
        run:
          rustup run stable rustfmt --edition 2021 --check
            libvips/rust/vips/lib.rs libvips/foreign/lib.rs libvips/rust/vips_rust.rs

      - name: Build and test with the minimum supported Rust
        run: |
          RUSTC="$(rustup which --toolchain "$MSRV" rustc)" \
            meson setup build-msrv -Drust=enabled -Dmodules=disabled -Dintrospection=disabled
          meson compile -C build-msrv
          meson test -C build-msrv rust-vips rust-foreign
          nm -D --defined-only build-msrv/libvips/libvips.so |
            awk '{ print $NF }' | grep -Ev '^_?(vips|im)_|^(Vips|VIPS_|nsgif_|lzw_)' &&
            { echo "Rust symbols exported from libvips"; exit 1; } || true

      - name: clippy
        env:
          CLIPPY_CONF_DIR: ${{ github.workspace }}/libvips/rust
        run: |
          RUSTC="$(rustup which --toolchain stable clippy-driver)" \
            meson setup build-clippy -Drust=enabled -Dmodules=disabled -Dintrospection=disabled \
            "-Drust_args=-Dwarnings -Wclippy::all -Wclippy::undocumented_unsafe_blocks"
          ninja -C build-clippy libvips/libvips_rust.a libvips/rust/rust-vips libvips/foreign/rust-foreign

      # A static libvips with Rust, ASan, UBSan and libFuzzer, like OSS-Fuzz,
      # run on BMP files for the Rust loader.
      - name: Fuzz
        env:
          CC: clang
          CXX: clang++
          ASAN_OPTIONS: allocator_may_return_null=1
          UBSAN_OPTIONS: halt_on_error=1:abort_on_error=1:print_stacktrace=1
        run: |
          meson setup build-fuzz --default-library=static -Drust=enabled \
            -Dmodules=disabled -Dintrospection=disabled -Dcplusplus=false -Dtools=false \
            -Db_sanitize=address,undefined -Db_lundef=false \
            -Dc_args=-fno-sanitize=function -Dcpp_args=-fno-sanitize=function \
            -Dfuzz=true -Dfuzzing_engine=libfuzzer
          meson compile -C build-fuzz fuzz/pngsave_buffer_fuzzer
          mkdir corpus
          python3 - <<'EOF'
          import struct
          for w, h in [(1, 1), (3, 2), (16, 16), (33, 7)]:
              stride = (3 * w + 3) & ~3
              header = b'BM' + struct.pack('<IHHI', 54 + stride * h, 0, 0, 54)
              header += struct.pack('<IiiHHIIiiII', 40, w, h, 1, 24, 0, stride * h, 2835, 2835, 0, 0)
              pixels = bytes((x * y) & 255 for y in range(h) for x in range(stride))
              open(f'corpus/{w}x{h}.bmp', 'wb').write(header + pixels)
          EOF
          ./build-fuzz/fuzz/pngsave_buffer_fuzzer -max_total_time=60 -max_len=4096 corpus

